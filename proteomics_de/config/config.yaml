# =============================================================================
# proteomics_de/config/config.yaml
#
# WHAT THIS IS: a single declarative source of truth for the mouse SILAC
# proteomics DE pipeline's design, thresholds, file contracts, and downstream
# enrichment parameters (research1.md Section 6, item 1).
#
# WHAT THIS IS NOT: the existing flat scripts (foldchange.py, replicate_check.py,
# centering_check.py, limma_test.py/.R, enrich/*.py, viz/*.py) do NOT read this
# file. They are frozen, individually verified, and out of scope for this
# reproducibility layer (see DECISIONS_LOG.md, D1). This file is DESCRIPTIVE
# documentation of the design those scripts already implement, encoded
# declaratively so it can be (a) validated against the committed outputs by
# proteomics_de/qc/schema.py + validate.py, and (b) read by a human or a future
# script without re-deriving the design from source code.
#
# FORWARD-PATH PIVOT POINT: per research1.md's "FORWARD-PATH SECTION — If
# biological replicates arrive", the design is meant to become a config change,
# not a rewrite. The mechanism is `config/sample_sheet.tsv`: it is
# replicate-count-agnostic by construction (sample, group, channel, replicate).
# Adding biological replicates means appending rows to that sheet (new sample
# IDs, replicate index 3, 4, ...) and regenerating `design.tsv` / the limma
# `model.matrix(~group)` from it — not editing this file's structure or the
# scripts' logic by hand. When that happens, thresholds.n_technical_replicates
# below changes from 2 to reflect the new design, and the
# "technical-replicates-only" caveat (see notes.caveat) is lifted.
# =============================================================================

organism:
  common_name: "mouse"
  scientific_name: "Mus musculus"
  ncbi_taxid: 10090
  gene_symbol_convention: "title-case MGI symbols (e.g. Lama1, Sptan1, Cryab)"
  note: >
    Corrected from an initial human/9606 assumption in research1.md (see
    DECISIONS_LOG.md D5): 99.7% of gene symbols in the committed data are
    title-case MGI nomenclature, and H2-K1 is a mouse MHC class-I gene, not
    the human ortholog HLA. All organism-specific parameters below (STRING,
    g:Profiler) use the mouse identifiers.

design:
  assay: "SILAC (Stable Isotope Labeling by Amino acids in Cell culture)"
  # n=2 TECHNICAL replicates per group; NOT biological replicates. This is a
  # hard ceiling on statistical inference (see notes.caveat) until the sample
  # sheet grows per the FORWARD-PATH note above.
  n_technical_replicates_per_group: 2
  n_biological_replicates_per_group: 1
  sample_sheet: "proteomics_de/config/sample_sheet.tsv"
  groups:
    control:
      label: "Light (control)"
      channels: ["Intensity 31578", "Intensity 31580"]
    treated:
      label: "Heavy (treated)"
      channels: ["Intensity 31579", "Intensity 31581"]
  contrast:
    name: "treated_vs_control"
    numerator: "treated"
    denominator: "control"
    description: "log2(treated / control); positive log2FC = UP in treated"

thresholds:
  # |log2FC| >= log2(1.5) = 0.584962500721156, rounded to 0.585 in reporting.
  log2fc_regulation_cutoff: 0.585
  fold_change_linear_equivalent: 1.5
  significance:
    metric: "adj.P.Val (Benjamini-Hochberg FDR)"
    alpha: 0.05
  imputation:
    method: "MinProb"
    q: 0.01
    package: "imputeLCMD 2.1 (R)"
  rng_seed: 42

statistics:
  engine: "limma 3.68.4 (R 4.6.1)"
  design_matrix: "~group (two-group contrast; no batch/covariate terms at n=2 technical replicates)"
  # DECISIONS_LOG D9: the default is trend=TRUE, robust=TRUE (research1.md
  # line 124). The vanilla run is retained as results/qc_limma_vanilla.csv so
  # the two flavours stay comparable; the conclusion is unchanged either way
  # (still 0/1938 significant, min adj.p 0.305 -> 0.116).
  eBayes_variants_tested: ["vanilla", "trend+robust"]
  eBayes_default: "trend+robust"
  eBayes_mode_recorded_in: "proteomics_de/_limma_versions.txt (ebayes_mode)"

enrichment:
  string:
    species_taxid: 10090
    source: "STRING REST API"
  gprofiler:
    organism: "mmusculus"
    background: "custom: the detected proteome"
    # 2552 since DECISIONS_LOG D11 (was 2554). The 2 quarantined junk
    # accessions were never real proteins, so they were never legitimate
    # background either. The authoritative copy of this number is
    # tests/expected/frozen_counts.json:background_union, which
    # enrich/enrich_common.py reads at run time; the value here is
    # documentation and is asserted to agree in tests/test_schemas.py.
    background_n: 2552
    background_derivation: >
      Union of foldchange_all.csv (1948 rows) and single_condition_proteins.csv
      (604 rows) = 2552 rows (the full set of proteins with at least one
      non-missing intensity in either raw SILAC sheet, less the 2 rows
      quarantined by D11 whose "accession" was a MaxQuant row-index list
      rather than an accession -- see results/qc/quarantine_accessions.csv).
      Using this custom
      background instead of g:Profiler's default whole-genome background is
      the deliberate methodological choice documented in DECISIONS_LOG.md D6:
      the same UP query against the default background returns 196 spuriously
      "significant" terms, an artifact of comparing detected proteins to the
      whole genome rather than to what could have been detected.
    correction_method: "g:SCS"
    sources: ["GO:BP", "GO:MF", "GO:CC", "KEGG", "REAC"]
    user_threshold: 0.05
  gsea:
    tool: "gseapy prerank"
    gene_sets: "Enrichr mouse libraries"
    rng_seed: 42

file_contracts:
  # Read-only, committed pipeline outputs. Column lists and row counts are the
  # REAL observed contracts (see proteomics_de/qc/schema.py for the enforced
  # pandera schemas and proteomics_de/results/qc/qc_report.md for the last
  # validation run against these exact files).
  foldchange_all:
    path: "proteomics_de/results/foldchange_all.csv"
    expected_rows: 1948
    key_columns:
      ["UniProt Accession Number", "Gene names", "Intensity 31578",
       "Intensity 31580", "Intensity 31579", "Intensity 31581",
       "ratio_rep1", "ratio_rep2", "log2_rep1", "log2_rep2", "log2FC",
       "complete", "regulated", "onoff"]
  qc_limma:
    path: "proteomics_de/results/qc_limma.csv"
    expected_rows: 1938
    # n_imputed / AveExpr / t / B appended by DECISIONS_LOG D10. Their absence
    # here (and in qc/schema.py's QC_LIMMA_SCHEMA, which is strict=True) is
    # what made every validation run fail with `column_in_schema` until this
    # was corrected -- the schema-drift test in tests/test_schemas.py now
    # fails loudly the moment this list falls behind the file again.
    key_columns:
      ["id", "gene", "Intensity 31578", "Intensity 31580",
       "Intensity 31579", "Intensity 31581", "limma_log2FC", "p_value",
       "adj_p_value", "significant", "regulated",
       "n_imputed", "AveExpr", "t", "B"]
  ipa_input:
    path: "proteomics_de/results/ipa_input.csv"
    expected_rows: 715
    key_columns: ["UniProt Accession Number", "Gene names", "log2FC", "regulated"]
  single_condition_proteins:
    path: "proteomics_de/results/single_condition_proteins.csv"
    # 606 -> 604 at DECISIONS_LOG D11: the 2 rows whose "accession" was a
    # ';'-joined list of bare MaxQuant row indices are quarantined to
    # results/qc/quarantine_accessions.csv instead of being shipped.
    expected_rows: 604
    key_columns:
      ["accession", "gene", "detected_in", "Intensity 31578",
       "Intensity 31580", "Intensity 31579", "Intensity 31581"]
  onoff_proteins:
    path: "proteomics_de/results/onoff_proteins.csv"
    expected_rows: 10
    key_columns:
      ["accession", "gene", "onoff", "Intensity 31578", "Intensity 31580",
       "Intensity 31579", "Intensity 31581"]
  # --- contract files added by later layers -------------------------------
  # These had no schema at all until now, which is the same silent-drift
  # exposure that D10 turned into a hard failure on qc_limma.csv.
  intensity_matrix:
    path: "proteomics_de/results/de/intensity_matrix.tsv"
    separator: "tab"
    expected_rows: 1938
    key_columns:
      ["accession", "gene", "Intensity 31579", "Intensity 31581",
       "Intensity 31578", "Intensity 31580"]
  design_matrix:
    path: "proteomics_de/results/de/design.tsv"
    separator: "tab"
    expected_rows: 4
    key_columns: ["sample", "group"]
  limma_results:
    path: "proteomics_de/results/de/limma_results.tsv"
    separator: "tab"
    expected_rows: 1938
    key_columns:
      ["accession", "gene", "logFC", "fold_change", "AveExpr", "t",
       "P.Value", "adj.P.Val", "B", "n_imputed", "direction"]
  ipa_input_full:
    path: "proteomics_de/results/ipa_input_full.csv"
    expected_rows: 715
    key_columns:
      ["UniProt Accession Number", "Gene names", "log2FC", "regulated",
       "p_value", "adj_p_value"]

qc:
  # Written by qc/validate.py and qc/boundaries.py; read-only over everything else.
  validation_report: "proteomics_de/results/qc/qc_report.json"
  boundary_records: "proteomics_de/results/qc/qc_boundaries.json"
  quarantine: "proteomics_de/results/qc/quarantine_accessions.csv"
  boundary_stages:
    # Permissive stages see raw MaxQuant data, where a malformed accession is a
    # fact about the input, not a bug: they record and route to quarantine.
    # Strict stages see frames this repo produced: a failure there stops the run.
    permissive: ["after_load", "after_merge"]
    strict: ["after_foldchange", "before_ipa_export"]

notes:
  caveat: >
    n=2 is a TECHNICAL, not biological, replicate count. Per research1.md and
    DECISIONS_LOG.md D2, 0/1938 proteins survive adj.P.Val<0.05 (min adj.p =
    0.305) -- the expected ceiling at this replicate count, not a bug (corr of
    limma log2FC vs. pipeline log2FC = 1.0000). Every downstream figure/table
    must carry a "technical replicates -> hypothesis-generating only" caveat
    until biological replicates are added per the FORWARD-PATH section.
